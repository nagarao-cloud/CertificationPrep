<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CertificationPrep</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1">
  <meta name="description" content="Dense, self-contained certification study material — AWS and GCP.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-size: 16px;
      --content-max-width: 60em;
      --sidebar-width: 300px;
    }
    .app-name-link img { height: 1.2em; vertical-align: -0.2em; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    pre, code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .markdown-section pre { border-radius: 6px; }
    .sidebar-nav li.active > a { font-weight: 700; }
  </style>
</head>
<body>
  <div id="app">Loading CertificationPrep…</div>
  <script>
    window.$docsify = {
      name: '📚 CertificationPrep',
      repo: 'https://github.com/nagarao-cloud/CertificationPrep',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      mergeNavbar: true,
      homepage: 'README.md',
      coverpage: false,
      loadNavbar: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search all exams…',
        noData: 'No results.',
        depth: 4,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true,
      },
      formatUpdated: '{MM}/{DD}/{YYYY}',
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
